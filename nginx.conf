worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # Keep Railway logs focused on the apps, not every request
    access_log off;
    # Uploads (FileBrowser) and streaming (Jellyfin) may send/receive large bodies
    client_max_body_size 0;

    # Allow websocket upgrades (Jellyfin + FileBrowser)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream jellyfin {
        server 127.0.0.1:8096;
    }

    upstream filebrowser {
        server 127.0.0.1:8080;
    }

    server {
        # Public port (must match the PORT variable set on Railway)
        listen 8095;
        server_name _;

        # Railway healthcheck -> Jellyfin /health (200 when the server is up)
        location = /health {
            proxy_pass http://jellyfin/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FileBrowser (web uploader), served under /files/
        location /files/ {
            proxy_pass http://filebrowser;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Everything else goes to Jellyfin
        location / {
            proxy_pass http://jellyfin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
